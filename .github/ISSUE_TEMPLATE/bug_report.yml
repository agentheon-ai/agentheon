name: Bug report
description: Something behaves differently from what the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](https://github.com/agentheon-ai/agentheon/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. agentheon check
        2. agentheon ask "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: check-output
    attributes:
      label: Output of `agentheon check`
      description: This shows which skills, tools and rules actually loaded.
      render: text
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Agentheon version
      description: "`pip show agentheon`, or the commit SHA if running from a clone."
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.13 on Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: LLM_MODEL
      description: The model string only — never paste an API key.
      placeholder: gpt-4o-mini
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Redact anything sensitive. Keys, customer data and personal data do not belong here.
      render: text
