[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentheon"
version = "0.1.0"
description = "A small, governed, skills-based agent platform. Skills are markdown files; answers are sourced, checked and auditable."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Agentheon contributors" }]
keywords = ["agents", "llm", "skills", "mcp", "governance"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Framework :: FastAPI",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "litellm>=1.40",
]

[project.optional-dependencies]
search = ["ddgs>=9.0"]
mcp = ["mcp>=1.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
agentheon = "agentheon.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agentheon"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses Depends() in argument defaults by design
